; Monitor Switcher Configuration File
; ====================================================================

[Monitors]
; GAME_MONITOR: Which monitor to switch to when an app launches (1, 2, 3, etc.)
GAME_MONITOR=1

; DEFAULT_MONITOR: Which monitor to restore to after app opens (typically main monitor)
DEFAULT_MONITOR=3

[Applications]
; Format: AppName=timeout_in_seconds
; Examples:
; Notepad.exe=3

SkyrimSE.exe=12